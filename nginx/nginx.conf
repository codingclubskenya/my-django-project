# Nginx config for learningpack - Docker container
# Uses --network host to access gunicorn at 127.0.0.1:8000

# Request limits per client IP (coarse DoS guard; fine-grained login/payment limits live in Django).
# 30 r/s with a burst of 100 comfortably covers a school behind one NAT.
limit_req_zone $binary_remote_addr zone=lp_api:10m rate=30r/s;
limit_req_status 429;

# HTTPS server
server {
    listen 443 ssl;
    server_name codingclubskenya.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Client upload size
    client_max_body_size 50M;

    # React frontend at /learningpack/
    location /learningpack/ {
        alias /usr/share/nginx/html/learningpack/;
        try_files $uri $uri/ /learningpack/index.html;
    }

    location = /learningpack {
        return 301 /learningpack/;
    }

    # Django API - proxy to gunicorn, strip /learningpack prefix
    location /learningpack/api/ {
        limit_req zone=lp_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Django admin - proxy to gunicorn, strip /learningpack prefix
    location /learningpack/admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Django static files
    location /learningpack/static/ {
        alias /var/www/school_static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Private uploads (CVs, student work, evidence, internal documents) are never
    # served directly: Django checks the permission, then nginx streams the file
    # from the internal location below (X-Accel-Redirect). Keep this prefix list
    # in sync with core/private_files.py PRIVATE_PREFIXES (a test enforces it).
    location ~* ^/learningpack/media/(recruitment|assessment_evidence|reference_documents|scheme_uploads|course_attachments|course_materials|submissions|form_submissions|disputes)/ {
        return 404;
    }

    location /protected-media/ {
        internal;
        alias /var/www/school_media/;
        add_header X-Content-Type-Options nosniff always;
    }

    # Django media files
    location /learningpack/media/ {
        alias /var/www/school_media/;
        expires 7d;
    }

    # Distributor app (Next.js) - proxy to port 3001
    location /distributor/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
