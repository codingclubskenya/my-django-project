# Nginx config for learningpack - Docker container
# Uses --network host to access gunicorn at 127.0.0.1:8000

# HTTPS server
server {
    listen 443 ssl;
    server_name codingclubskenya.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Client upload size
    client_max_body_size 50M;

    # React frontend at /learningpack/
    location /learningpack/ {
        alias /usr/share/nginx/html/learningpack/;
        try_files $uri $uri/ /learningpack/index.html;
    }

    location = /learningpack {
        return 301 /learningpack/;
    }

    # Django API - proxy to gunicorn, strip /learningpack prefix
    location /learningpack/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Django admin - proxy to gunicorn, strip /learningpack prefix
    location /learningpack/admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Django static files
    location /learningpack/static/ {
        alias /var/www/school_static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django media files
    location /learningpack/media/ {
        alias /var/www/school_media/;
        expires 7d;
    }

    # Distributor app (Next.js) - proxy to port 3001
    location /distributor/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
