<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Nunito:wght@400;600;700&amp;family=Poppins:wght@400;500;600&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C9D1E6}a:hover{color:#FFFFFF}
</style>
</helmet>
<nav aria-label="Main menu" style="width: 272px; min-height: 100%; box-sizing: border-box; background: #0F1E3D; color: #E6EAF5; display: flex; flex-direction: column; gap: 4px; padding: 18px 14px 20px; font-family: {{fontStack}}">

<div style="display: flex; align-items: center; gap: 12px; padding: 4px 6px 14px">
<div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #F26B1D; color: #0F1E3D; display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none">CC</div>
<div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
<span style="font-size: 15px; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Coding Clubs Kenya</span>
<span style="font-size: 12px; color: #9AA6C4">School ERP</span>
</div>
<sc-if value="{{closeable}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Close menu" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #1A2C52; display: grid; place-items: center; cursor: pointer; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
</sc-if>
</div>

<label style="display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; margin-bottom: 8px; border-radius: 12px; background: #1A2C52; box-sizing: border-box">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA6C4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
<input type="search" aria-label="Find a page" placeholder="Find a page…" style="border: 0; outline: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; flex: 1; min-width: 0">
</label>

<sc-if value="{{dashActive}}" hint-placeholder-val="{{true}}">
<a href="Main.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border-radius: 12px; background: #F26B1D; color: #0F1E3D; text-decoration: none; font-size: 14px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F1E3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Dashboard</a>
</sc-if>
<sc-if value="{{dashIdle}}" hint-placeholder-val="{{false}}">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border-radius: 12px; text-decoration: none; font-size: 14px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9D1E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Dashboard</a>
</sc-if>

<div style="height: 1px; background: #22355E; margin: 8px 6px"></div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column">
<button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.open}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 12px; background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left">
<span style="width: 30px; height: 30px; border-radius: 9px; background: {{g.tile}}; display: grid; place-items: center; flex: none">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{g.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg>
</span>
<span style="flex: 1">{{g.label}}</span>
<span style="font-size: 12px; color: #9AA6C4; font-weight: 500">{{g.count}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA6C4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{g.chevron}}"></path></svg>
</button>
<sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 1px; margin: 2px 0 8px 24px; padding-left: 16px; border-left: 1px solid #22355E">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
<sc-if value="{{it.active}}" hint-placeholder-val="{{false}}">
<a href="{{it.href}}" aria-current="page" style="display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 10px; border-radius: 10px; background: #2A2F45; color: #FFB27A; text-decoration: none; font-size: 14px; font-weight: 700">
<span style="width: 6px; height: 6px; border-radius: 50%; background: #F26B1D"></span>{{it.label}}</a>
</sc-if>
<sc-if value="{{it.idle}}" hint-placeholder-val="{{true}}">
<a href="{{it.href}}" style="display: flex; align-items: center; min-height: 38px; padding: 0 10px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500">{{it.label}}</a>
</sc-if>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>

<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 10px; margin-top: 12px; border-radius: 14px; background: #1A2C52">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #FFB27A; color: #0F1E3D; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none">AD</div>
<div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
<span style="font-size: 14px; font-weight: 600; color: #FFFFFF">School Admin</span>
<span style="font-size: 12px; color: #9AA6C4">Admin</span>
</div>
<button type="button" aria-label="Sign out" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D1E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
</button>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Dashboard"},"font":{"editor":"enum","options":["Inter","Plus Jakarta Sans","Nunito","Poppins","DM Sans","System"],"default":"Inter"},"closeable":{"editor":"boolean","default":false},"$preview":{"width":272,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Dashboard';
    const font = this.props.font ?? 'Inter';
    const stacks = { 'Inter': "Inter, system-ui, sans-serif", 'Plus Jakarta Sans': "'Plus Jakarta Sans', system-ui, sans-serif", 'Nunito': "Nunito, system-ui, sans-serif", 'Poppins': "Poppins, system-ui, sans-serif", 'DM Sans': "'DM Sans', system-ui, sans-serif", 'System': "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" };
    const closed = (this.state && this.state.closed) || {};
    const defs = [
      { label: 'Academics', icon: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M8 7h7', items: ['Classes', 'Subjects', 'Exams', 'Assessments', 'Attendance', 'Timetable', 'Schemes of Work', 'Reference Documents', 'Courses'] },
      { label: 'Learners', icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8', items: ['Students', 'Enrollments', 'Parents', 'Discipline', 'Health', 'Clubs', 'Alumni'] },
      { label: 'Staff', icon: 'M3 7h18v13H3zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18', items: ['Staff', 'Teachers', 'Teacher Assignments', 'Payroll'] },
      { label: 'Finance', icon: 'M3 6h15a3 3 0 0 1 3 3v9H3zM3 6V5a2 2 0 0 1 2-2h11M16 13h2', items: ['Fees', 'Invoices', 'Payments', 'Procurement'] },
      { label: 'Shop & Books', icon: 'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0', items: ['Shop Orders', 'Booklists', 'Library'] },
      { label: 'Communication', icon: 'M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z', items: ['Messages', 'Parent Meetings', 'Complaints'] },
      { label: 'School', icon: 'M4 21V8l8-5 8 5v13M9 21v-6h6v6', items: ['Website Builder', 'Calendar', 'Settings'] }
    ];
    const groups = defs.map((g) => {
      const hasActive = g.items.indexOf(active) !== -1;
      const open = closed[g.label] === undefined ? true : !closed[g.label];
      return {
        label: g.label,
        icon: g.icon,
        count: g.items.length,
        open: open,
        tile: hasActive ? '#F26B1D' : '#1A2C52',
        iconColor: hasActive ? '#0F1E3D' : '#FFB27A',
        chevron: open ? 'm6 9 6 6 6-6' : 'm9 6 6 6-6 6',
        toggle: () => this.setState({ closed: Object.assign({}, closed, { [g.label]: open }) }),
        items: g.items.map((l) => ({ label: l, href: l === 'Staff' ? 'Staff.dc.html' : '#', active: l === active, idle: l !== active }))
      };
    });
    return {
      fontStack: stacks[font] || stacks['Inter'],
      closeable: !!this.props.closeable,
      dashActive: active === 'Dashboard',
      dashIdle: active !== 'Dashboard',
      groups: groups
    };
  }
}
</script>
</body>
</html>
