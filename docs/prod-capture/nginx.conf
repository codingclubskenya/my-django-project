user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 443 ssl http2;
        server_name codingclubskenya.com  213.199.41.219;

        ssl_certificate /etc/letsencrypt/live/codingclubskenya.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/codingclubskenya.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 50M;

        # Primary React Frontend Root
        root /home/devops/home/personal/personalweb/frontend-apk-web/codingclubskenya/dist;
        index index.html;

        location = /schoolsystem {
            return 301 /schoolsystems/;
        }
        location = /schoolsystems {
            return 301 /schoolsystems/;
        }

        location /schoolsystems/ {
            alias /var/www/codingclubskenya/;
            index index.html;
            try_files $uri $uri/ /schoolsystems/index.html;
        }

        # Learningpack static assets - MUST come before /learningpack/
        location ^~ /learningpack/assets/ {
            alias /var/www/learningpack/assets/;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Disributor _next static assets - MUST come before /learningpack/
        location ^~ /learningpack/_next/ {
            alias /home/devops/home/personal/personalweb/disributor/.next/;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Learningpack static files (React SPA with base /learningpack/)
        location /learningpack/ {
            alias /var/www/learningpack/;
            index index.html;
            try_files $uri $uri/ /learningpack/index.html;
        }

        location = /learningpack {
            return 301 /learningpack/;
        }

        # Disributor Next.js Server - learningpack (if needed on different path)
        # location ^~ /learningpack-next/ {
        #     add_header Cache-Control "no-store,no-cache,must-revalidate";
        #     proxy_pass http://localhost:3001;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection 'upgrade';
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_cache_bypass $http_upgrade;
        #     proxy_read_timeout 86400;
        # }

        # Django Static Files
        location /static/ {
            alias /home/devops/home/personal/personalweb/epk/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Django Media Files
        location /media/ {
            alias /home/devops/home/personal/personalweb/epk/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Django API Proxy
        location /api/ {
            include proxy_params;
            proxy_pass http://unix:/home/devops/home/personal/personalweb/epk/epk.sock;
        }

        # Django Admin Proxy
        location /admin/ {
            include proxy_params;
            proxy_pass http://unix:/home/devops/home/personal/personalweb/epk/epk.sock;
        }

        # Disributor routes accessible from root (redirect to /learningpack app)
        location ~* ^/(contact|track-your-order|find-my-school-list|upload-my-list|distributor-onboarding|product-category)(?:/|$) {
            return 301 /learningpack$request_uri;
        }

        # Primary React SPA Catch-All
        location / {
            add_header Cache-Control "no-store,no-cache,must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name codingclubskenya.com www.codingclubskenya.com 213.199.41.219;
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/conf.d/*.conf;
}