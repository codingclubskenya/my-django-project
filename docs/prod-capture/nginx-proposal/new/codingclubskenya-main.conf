server {
    server_name erp.codingclubskenya.com www.erp.codingclubskenya.com;

    root /home/devops/home/personal/personalweb/frontend-apk-web/codingclubskenya/dist;
    index index.html;

    # Defence in depth: private upload prefixes are never served from this host.
    location ~* ^/media/(recruitment|assessment_evidence|reference_documents|scheme_uploads|course_attachments|course_materials|submissions|form_submissions|disputes)/ {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /schoolsystems/ {
        alias /var/www/codingclubskenya/;
        index index.html;
        try_files $uri $uri/ /schoolsystems/index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/erp.codingclubskenya.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.codingclubskenya.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}

server {
    if ($host = erp.codingclubskenya.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name erp.codingclubskenya.com www.erp.codingclubskenya.com;
    return 301 https://$host$request_uri;


}