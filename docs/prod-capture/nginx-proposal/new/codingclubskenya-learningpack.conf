server {
    server_name learningpack.codingclubskenya.com;

    root /home/devops/home/personal/personalweb/disributor/out;
    index index.html;

    # Next.js static assets - cache aggressively
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /_next/ {
        try_files $uri $uri/ =404;
    }

    # Static assets (images, fonts, etc)
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js static export SPA fallback
    # Defence in depth: private upload prefixes are never served from this host.
    location ~* ^/media/(recruitment|assessment_evidence|reference_documents|scheme_uploads|course_attachments|course_materials|submissions|form_submissions|disputes)/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/codingclubskenya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codingclubskenya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name learningpack.codingclubskenya.com;
    return 301 https://$host$request_uri;
}