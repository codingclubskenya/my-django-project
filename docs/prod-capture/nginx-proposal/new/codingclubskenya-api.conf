server {
    server_name api.codingclubskenya.com;

    client_max_body_size 50M;

    # Django Static Files
    location /static/ {
        alias /home/devops/home/personal/personalweb/epk/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Private uploads are never served directly: Django checks permission, then
    # nginx streams the file from the internal location below (X-Accel-Redirect).
    # Keep in sync with core/private_files.py PRIVATE_PREFIXES.
    location ~* ^/media/(recruitment|assessment_evidence|reference_documents|scheme_uploads|course_attachments|course_materials|submissions|form_submissions|disputes)/ {
        return 404;
    }

    location /protected-media/ {
        internal;
        alias /home/devops/home/personal/personalweb/epk/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    # Django Media Files
    location /media/ {
        alias /home/devops/home/personal/personalweb/epk/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django API Proxy
    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/home/devops/home/personal/personalweb/epk/epk.sock;
        proxy_read_timeout 300;
    }

    # Django Admin
    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/home/devops/home/personal/personalweb/epk/epk.sock;
        proxy_read_timeout 300;
    }

    # Health check
    location /health {
        include proxy_params;
        proxy_pass http://unix:/home/devops/home/personal/personalweb/epk/epk.sock/api/health/;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/codingclubskenya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codingclubskenya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.codingclubskenya.com;
    return 301 https://$host$request_uri;
}